apiVersion: v1
kind: Service
metadata:
    name: {{ .Values.email.name }}
    labels:
        app: {{ .Values.email.name }}

spec:
    selector:
        app: {{ .Values.email.name }}

    ports:
        - name: "{{ .Values.email.service.port }}-{{ .Values.email.deployment.port }}"
          port: {{ .Values.email.service.port }}
          protocol: {{ .Values.service.protocol }}
          targetPort: {{ .Values.email.deployment.port }}

    type: {{ .Values.service.type }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ .Values.email.name }}
    labels:
        app: {{ .Values.email.name }}

spec:
    replicas: {{ .Values.replicaCount }}

    selector:
        matchLabels:
            app: {{ .Values.email.name }}
    template:
        metadata:
            labels:
                app: {{ .Values.email.name }}
        spec:
            containers:
                - name: "{{ .Values.email.name }}-repo"
                  image: "{{ .Values.email.image.repo }}:{{ .Values.email.image.tag }}"
                  imagePullPolicy: {{ .Values.imagePullPolicy }}
                  envFrom:
                      - secretRef:
                            name: {{ .Values.email.secretName }}
                  resources:
                      {{- toYaml .Values.email.resources | nindent 20 }}
                  livenessProbe:
                      httpGet:
                          path: /liveness
                          port: {{ .Values.email.deployment.port }}
                          scheme: HTTP
                      initialDelaySeconds: 15
                      periodSeconds: 20
                      timeoutSeconds: 5
                      failureThreshold: 3

                  readinessProbe:
                      httpGet:
                          path: /readiness
                          port: {{ .Values.email.deployment.port }}
                          scheme: HTTP
                      initialDelaySeconds: 5
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3