imagePullPolicy: Always

replicaCount: 1

certificate:
    gateway:
        name: auth-service-gateway-tls
    auth-service:
        name: auth-service-tls
    caBundle:
        name: local-ca

gatewayClass:
    name: traefik-class
    controllerName: traefik.io/gateway-controller

gateway:
    name: auth-service-gateway
    tlsSecretName: auth-service-gateway-tls-secret

auth:
    route:
        name: auth-service-route
        hostName: auth.tomcheese.com

    name: auth-service
    service:
        port: 8080
    deployment:
        port: 8080
    image:
        repo: tomcheese/auth-service
        tag: latest
    configmap:
        name: auth-service-config
    resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 200m
            memory: 128Mi
    tlsSecretName: auth-service-tls-secret
    tlsHostName: auth-service.auth.svc.cluster.local

service:
    type: ClusterIP
    protocol: TCP
    port:
        HTTP: 80
        HTTPS: 443
