imagePullPolicy: Always

replicaCount: 1

certificate:
    gateway:
        name: auth-service-gateway-tls
    auth:
        name: auth-service-tls
    caBundle:
        name: local-ca

gatewayClass:
    name: traefik-class
    controllerName: traefik.io/gateway-controller

gateway:
    name: auth-service-gateway
    tlsSecretName: auth-service-gateway-tls-secret

auth:
    route:
        name: auth-service-route
        hostName: auth.tomcheese.ca

    name: auth-service
    service:
        port: 8443
    deployment:
        port: 8443
    image:
        repo: tomcheese/auth-service
        tag: 0.6.0
    configmap:
        name: auth-service-config
    secretName: auth-service-secret
    resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 200m
            memory: 128Mi
    tlsSecretName: auth-service-tls-secret
    tlsHostName: auth-service.auth.svc.cluster.local
    migration:
        image:
            repo: tomcheese/auth-migrations
            tag: 0.6.0
        command:
            - --migrate
    outbox:
        role:
            name: debezium
            password: postgres
        publication:
            name: outbox_publication

service:
    type: ClusterIP
    protocol: TCP
    port:
        HTTP: 80
        HTTPS: 443
