apiVersion: v1
kind: Service
metadata:
    name: {{ .Values.auth.name }}
    labels:
        app: {{ .Values.auth.name }}

spec:
    selector:
        app: {{ .Values.auth.name }}

    ports:
        - name: "{{ .Values.auth.service.port }}-{{ .Values.auth.deployment.port }}"
          port: {{ .Values.auth.service.port }}
          protocol: {{ .Values.service.protocol }}
          targetPort: {{ .Values.auth.deployment.port }}

    type: {{ .Values.service.type }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ .Values.auth.name }}
    labels:
        app: {{ .Values.auth.name }}

spec:
    replicas: {{ .Values.replicaCount }}

    selector:
        matchLabels:
            app: {{ .Values.auth.name }}
    template:
        metadata:
            labels:
                app: {{ .Values.auth.name }}
        spec:
            containers:
                - name: "{{ .Values.auth.name }}-repo"
                  image: "{{ .Values.auth.image.repo }}:{{ .Values.auth.image.tag }}"
                  imagePullPolicy: {{ .Values.imagePullPolicy }}
                  volumeMounts:
                      - name: auth-service-tls
                        mountPath: /certs
                        readOnly: true
                  envFrom:
                      - configMapRef:
                            name: {{ .Values.auth.configmap.name }}
                  resources:
                      {{- toYaml .Values.auth.resources | nindent 20 }}
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: {{ .Values.auth.deployment.port }}
                          scheme: HTTPS
                      initialDelaySeconds: 15
                      periodSeconds: 20
                      timeoutSeconds: 5
                      failureThreshold: 3

                  readinessProbe:
                      httpGet:
                          path: /health
                          port: {{ .Values.auth.deployment.port }}
                          scheme: HTTPS
                      initialDelaySeconds: 5
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3

            volumes:
                - name: auth-service-tls
                  secret:
                      secretName: {{ .Values.auth.tlsSecretName }}
