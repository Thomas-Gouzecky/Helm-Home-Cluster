apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
    name: "{{ .Values.auth.name }}-tls"

spec:
    targetRefs:
        - group: ""
          kind: Service
          name: {{ .Values.auth.name }}

    validation:
        hostname: "{{ .Values.auth.tlsHostName }}"
        caCertificateRefs:
            - group: ""
              kind: ConfigMap
              name: {{ .Values.certificate.caBundle.name }}