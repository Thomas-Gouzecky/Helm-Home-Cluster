apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: {{ .Values.auth.route.name }}
spec:
    parentRefs:
        - name: {{ .Values.gateway.name }}
          sectionName: https
          kind: Gateway

    hostnames:
        - {{ .Values.auth.route.hostName }}

    rules:
        - matches:
              - path:
                    type: PathPrefix
                    value: /

          backendRefs:
              - name: {{ .Values.auth.name }}
                port: {{ .Values.auth.service.port }}